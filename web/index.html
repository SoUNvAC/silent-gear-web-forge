<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silent Gear 拼配台</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="grass-bar" aria-hidden="true"></div>
        <div class="title-block">
          <h1 class="blocky-title">SILENT GEAR</h1>
          <span class="title-sub">Tool Builder · 拼配台</span>
        </div>
      </header>

      <!-- 当前装备：紧凑入口，完整类型按需展开 -->
      <section id="tool-selector" class="panel tool-selector" aria-label="装备类型"></section>

      <nav id="mobile-workflow" class="mobile-workflow" aria-label="配装步骤"></nav>

      <main id="app-main" class="app-main">
        <!-- 主流程：装配 → 选材 → 结果 -->
        <section id="assembly" class="panel" data-panel="assembly" aria-label="装配"></section>
        <section id="material-selector" class="panel" data-panel="materials" aria-label="材料"></section>
        <aside class="result-column" aria-label="拼装结果">
          <section id="tool-preview" class="panel" data-panel="tool-preview" aria-label="工具贴图预览"></section>
          <section id="preview" class="panel" data-panel="preview" aria-label="当前拼装"></section>
        </aside>
      </main>

      <!-- 智能推荐与库存属于辅助流程，放在工作台之后 -->
      <section id="best-build" class="panel best-build-bar" aria-label="最佳拼装"></section>
      <section id="inventory" class="panel inventory" aria-label="材料库存"></section>

      <div id="boot" class="boot">
        <span class="boot-text">◢ 加载数据中…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
